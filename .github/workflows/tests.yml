# The offline test suite on every push to any branch and on every pull request to main.
# No OPENROUTER_API_KEY is set here: the offline suite runs on fakes, and the four tests marked `live` (the OpenRouter
# smoke and budget tests) stay deselected through `addopts = "-m 'not live'"` in pyproject.toml. The paid evals
# (tests/eval/hs6_eval.py, tests/eval/e2e_eval.py) are run by hand, never here.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"   # the development version; pyproject.toml allows 3.11 to 3.13
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Offline test suite
        run: pytest -q
