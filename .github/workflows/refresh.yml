# The knowledge base refresh (feature 013): the TARIC snapshot daily and the EBTI rulings monthly, published as releases
# by scripts/refresh_taric.py and scripts/refresh_ebti.py (README, "Knowledge base refresh"). The scheduled jobs run
# only while the repository variable CARGOLINT_REFRESH is "on"; a manual run from the Actions tab runs regardless.
# GitHub disables these schedules after 60 days without repository activity: the Actions tab then shows the notice
# and the button that re-enables them. Runs go one at a time, and within a run the ebti job waits for the taric job,
# so one release is published at a time and each job's metadata sees the other's release.
name: refresh

on:
  schedule:
    - cron: "30 5 * * *"     # taric, daily, after the distribution's 23:00 stamp
    - cron: "0 6 1 * *"      # ebti, monthly, on the first
  workflow_dispatch:
    inputs:
      kind:
        description: "What to refresh"
        type: choice
        options: [taric, ebti, both]
        default: taric

permissions:
  contents: write            # the releases

concurrency: refresh         # one run at a time (jobs within a run are serialized by `needs`)

jobs:
  taric:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.kind == 'taric' || inputs.kind == 'both')) || (github.event_name == 'schedule' && github.event.schedule == '30 5 * * *' && vars.CARGOLINT_REFRESH == 'on') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # the write token is not kept in .git/config while pip runs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: pip install -e .
      - name: Refresh the TARIC snapshot
        run: python scripts/refresh_taric.py --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  ebti:
    needs: taric
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && (inputs.kind == 'ebti' || inputs.kind == 'both')) || (github.event_name == 'schedule' && github.event.schedule == '0 6 1 * *' && vars.CARGOLINT_REFRESH == 'on')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project
        run: pip install -e .
      - name: Refresh the EBTI rulings
        run: python scripts/refresh_ebti.py --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
